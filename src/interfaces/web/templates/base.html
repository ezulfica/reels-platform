<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reels Dishform{% endblock %}</title>
<script>
  (() => { const theme = localStorage.getItem("reels-theme") || "system"; if (theme !== "system") document.documentElement.dataset.theme = theme; })();
</script>
{% block head_extra %}{% endblock %}
<style>
  :root { --bg:#f6f7fb; --surface:#fff; --surface-2:#f0f1f8; --ink:#172033; --muted:#667085; --border:#e1e4ef; --accent:#5b5ce2; --accent-soft:#eef0ff; --warn:#d85264; --warn-soft:#fff0f2; }
  :root[data-theme="dark"] { --bg:#10111a; --surface:#191b29; --surface-2:#25283a; --ink:#f3f4ff; --muted:#aeb2c8; --border:#30334a; --accent:#a6a8ff; --accent-soft:#292c57; --warn:#ff98a6; --warn-soft:#48232b; } }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --bg:#10111a; --surface:#191b29; --surface-2:#25283a; --ink:#f3f4ff; --muted:#aeb2c8; --border:#30334a; --accent:#a6a8ff; --accent-soft:#292c57; --warn:#ff98a6; --warn-soft:#48232b; } }
  * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 12% -10%, #e2e5ff 0, transparent 30rem), var(--bg); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5; } h1,h2,h3 { font-family:inherit; letter-spacing:-.03em; margin:0; } a { color:var(--accent); } nav.top { display:flex; gap:1rem; align-items:center; overflow-x:auto; padding:.85rem max(1rem,calc((100vw - 70rem)/2)); background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; } nav .brand { color:var(--ink); font-weight:750; margin-right:.5rem; white-space:nowrap; } nav a { color:var(--muted); text-decoration:none; white-space:nowrap; font-size:.9rem; } nav a.active, nav a:hover { color:var(--accent); } main { max-width:70rem; margin:auto; padding:2rem 1.25rem 4rem; } .card { background:var(--surface); border:1px solid var(--border); box-shadow:0 8px 24px rgba(28,32,72,.06); border-radius:16px; padding:1rem 1.2rem; margin-bottom:.8rem; } .chip { display:inline-block; padding:.18rem .5rem; border-radius:999px; font-size:.75rem; white-space:nowrap; background:var(--surface-2); color:var(--muted); } .chip.ok { background:var(--accent-soft); color:var(--accent); } .chip.warn { background:var(--warn-soft); color:var(--warn); } input,select,textarea { width:100%; padding:.55rem .65rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; } label { display:block; font-size:.82rem; color:var(--muted); margin-bottom:.25rem; } button { padding:.55rem .9rem; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; } button.secondary { background:var(--surface-2); color:var(--ink); border:1px solid var(--border); } .grid-form { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:.7rem; } .field { margin-bottom:.7rem; } .recipe-filters { display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:.6rem; align-items:end; } .metric-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.7rem; } .metric { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.8rem 1rem; } .metric span { color:var(--muted); display:block; font-size:.78rem; } .metric strong { font:600 1.7rem Georgia,serif; } .dashboard-columns { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; margin-top:1.2rem; } .distribution { display:flex; justify-content:space-between; gap:1rem; padding:.4rem 0; border-bottom:1px solid var(--border); font-size:.9rem; } .distribution:last-child { border:0; } .recent-row { display:flex; justify-content:space-between; gap:1rem; align-items:start; padding:.75rem 0; border-bottom:1px solid var(--border); color:inherit; text-decoration:none; } .recent-row:hover strong { color:var(--accent); } .recent-row small { display:block; color:var(--muted); margin-top:.15rem; } .chat-layout { display:grid; grid-template-columns:15rem minmax(0,1fr); gap:1rem; min-height:70vh; } .chat-sidebar { border-right:1px solid var(--border); padding-right:.8rem; } .chat-sidebar h2 { font-size:.9rem; margin:1rem 0 .4rem; color:var(--muted); } .new-chat,.chat-session { display:block; padding:.55rem .65rem; border-radius:9px; text-decoration:none; color:var(--ink); font-size:.86rem; margin-bottom:.2rem; } .new-chat { background:var(--accent); color:#fff; } .chat-session.active,.chat-session:hover { background:var(--surface-2); } .chat-thread { max-width:48rem; width:100%; } .chat-explainer { color:var(--muted); font-size:.85rem; max-width:43rem; margin:.3rem 0 1rem; } .scheduled-run { display:flex; align-items:center; gap:.55rem; flex-wrap:wrap; padding:.7rem .85rem; margin:.8rem 0 1rem; border:1px solid var(--border); background:var(--surface); border-radius:12px; font-size:.86rem; } .chat-thread-header h1 { font-size:1.25rem; margin:.45rem 0 1rem; } .chat-messages { display:grid; gap:.8rem; min-height:25rem; } .chat-message { border-radius:14px; padding:.8rem .95rem; line-height:1.55; } .chat-message span { display:block; font-size:.73rem; color:var(--muted); margin-bottom:.3rem; } .chat-message.user { background:var(--accent-soft); margin-left:12%; } .chat-message.assistant { background:var(--surface); border:1px solid var(--border); margin-right:6%; } .chat-composer { display:grid; grid-template-columns:1fr auto; gap:.6rem; margin-top:1rem; } .chat-composer textarea { min-height:3.3rem; } .chat-delete { margin-top:.7rem; } .chat-error { color:var(--warn); } .chat-hero { padding:2.5rem 0 1.3rem; max-width:44rem; } .chat-hero h1 { font-size:clamp(2.1rem,5vw,3.7rem); letter-spacing:-.04em; margin:.6rem 0; } .chat-hero p { color:var(--muted); font-size:1.05rem; } .chat-form { max-width:46rem; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:0 18px 50px rgba(24,45,34,.1); padding:1rem; } .chat-form textarea { min-height:6rem; resize:vertical; margin:.35rem 0 .75rem; } .chat-form button { border-radius:999px; padding:.65rem 1.15rem; } .chat-answer { max-width:46rem; margin-top:1.2rem; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:0 10px 28px rgba(24,45,34,.07); padding:1.2rem 1.3rem; line-height:1.65; } .chat-answer.error { border-color:var(--warn); background:var(--warn-soft); } .video-card { margin-top:1.25rem; padding:1rem; background:var(--surface); border:1px solid var(--border); border-radius:12px; max-width:34rem; } .video-card video { display:block; width:100%; max-height:70vh; background:#000; border-radius:8px; } .video-card p { margin:.65rem 0 0; font-size:.85rem; } .view-switch { display:flex; gap:.2rem; margin:.6rem 0 1rem; } .view-switch a { padding:.3rem .65rem; border-radius:8px; background:var(--surface-2); text-decoration:none; font-size:.82rem; } .view-switch a.active { background:var(--accent); color:#fff; } .content-list { display:block; } .content-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.7rem; } .content-grid .card { margin:0; min-height:8rem; } .dashboard-recent-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.7rem; margin-top:.7rem; } .dashboard-recent-card { display:block; padding:.8rem; border:1px solid var(--border); border-radius:14px; background:var(--surface); color:var(--ink); text-decoration:none; } .dashboard-recent-card small { display:block; color:var(--muted); margin-top:.35rem; } .entity-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.7rem; } .entity-grid.list { grid-template-columns:1fr; } .entity-grid .entity-card { margin:0; } .entity-card { display:block; overflow:hidden; background:var(--surface); border:1px solid var(--border); box-shadow:0 8px 24px rgba(28,32,72,.06); border-radius:14px; color:var(--ink); text-decoration:none; } .entity-card:hover { border-color:var(--accent); transform:translateY(-1px); } .entity-card-body { padding:.75rem .8rem; min-width:0; } .entity-card-header { display:flex; align-items:start; justify-content:space-between; gap:.6rem; } .entity-card-header strong { display:block; font-size:.95rem; line-height:1.25; } .entity-thumb { width:3rem; height:3rem; flex:0 0 3rem; object-fit:cover; border-radius:9px; background:var(--surface-2); } .entity-tags { display:flex; flex-wrap:wrap; gap:.25rem; margin-top:.35rem; } .entity-summary { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; color:var(--muted); font-size:.84rem; line-height:1.4; margin:.65rem 0; } .entity-card-footer { border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding-top:.55rem; color:var(--muted); font-size:.75rem; } .source-row { display:grid; grid-template-columns:5.5rem 1fr auto; gap:.8rem; align-items:center; padding:.7rem 0; border-bottom:1px solid var(--border); color:inherit; text-decoration:none; } .source-row img { width:5.5rem; aspect-ratio:1/1; border-radius:10px; object-fit:cover; background:var(--surface-2); } .source-row small { display:block; color:var(--muted); margin-top:.15rem; } .personal-followup { margin-top:1.2rem; } .personal-followup h2 { font-size:1.1rem; } .personal-followup > p { color:var(--muted); font-size:.87rem; margin:.25rem 0 .8rem; } .empty { color:var(--muted); } .theme-control { color:var(--muted); font-size:.75rem; margin-left:auto; } .theme-select { width:auto; padding:.28rem .4rem; font-size:.78rem; } @media(max-width:760px) { main { padding:1.2rem .85rem 3rem; } .metric-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .dashboard-columns,.grid-form,.recipe-filters { grid-template-columns:1fr; } .chat-layout { grid-template-columns:1fr; } .chat-sidebar { border:0; padding:0; max-height:11rem; overflow:auto; } .chat-composer { grid-template-columns:1fr; } .page-heading { align-items:start; flex-direction:column; } .entity-card { grid-template-columns:5.8rem 1fr; min-height:7rem; } .source-row { grid-template-columns:4rem 1fr; } .source-row img { width:4rem; } .source-row .chip { display:none; } }
</style>
</head>
<body>
<nav class="top">
  <span class="brand">Reels Dishform</span>
  <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Overview</a>
  <a href="/reels" class="{{ 'active' if request.url.path.startswith('/reel') else '' }}">Reels</a>
  <a href="/catalog" class="{{ 'active' if request.url.path == '/catalog' or request.url.path.startswith('/entity/') else '' }}">Entities</a>
  <a href="/recipes" class="{{ 'active' if request.url.path == '/recipes' else '' }}">Recipes</a>
  <a href="/sport" class="{{ 'active' if request.url.path == '/sport' else '' }}">Sport</a>
  <a href="/chat" class="{{ 'active' if request.url.path == '/chat' else '' }}">Assistant</a>
  <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">Settings</a>
  <label class="theme-control" for="theme-select">Theme</label><select id="theme-select" class="theme-select" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
</nav>
<main>{% block content %}{% endblock %}</main>
<script>
(() => {
  let timer;
  async function refresh(form) {
    const url = new URL(form.action || location.href, location.href);
    const data = new FormData(form);
    for (const [key, value] of data) if (value) url.searchParams.set(key, value); else url.searchParams.delete(key);
    const response = await fetch(url, {headers: {"X-Requested-With": "ReelsDishform"}});
    if (!response.ok) return;
    const page = new DOMParser().parseFromString(await response.text(), "text/html");
    const next = page.querySelector("main");
    if (!next) return;
    document.querySelector("main").innerHTML = next.innerHTML;
    history.replaceState(null, "", url);
  }
  document.addEventListener("input", event => {
    const form = event.target.closest("form[data-live-filter]");
    if (!form || event.target.tagName === "SELECT") return;
    clearTimeout(timer); timer = setTimeout(() => refresh(form), 300);
  });
  document.addEventListener("change", event => {
    const form = event.target.closest("form[data-live-filter]");
    if (form) refresh(form);
  });
  document.addEventListener("submit", event => {
    const form = event.target.closest("form[data-live-filter]");
    if (!form) return; event.preventDefault(); refresh(form);
  });
})();
</script>
<script>
  (() => { const select = document.getElementById("theme-select"); if (!select) return; const value = localStorage.getItem("reels-theme") || "system"; select.value = value; select.addEventListener("change", () => { const next = select.value; localStorage.setItem("reels-theme", next); if (next === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next; }); })();
</script>
</body>
</html>
