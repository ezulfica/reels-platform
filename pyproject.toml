[project]
name = "reels-platform"
version = "1.0.1"
description = "Four-step ETL pipeline over saved Instagram reels"
requires-python = ">=3.11,<3.13"

dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "numpy>=2.0",
    # step2_enrich: transcription, OCR
    "faster-whisper>=1.2",
    # RapidOCR (PP-OCRv6 models through onnxruntime) replaces easyocr. Measured on
    # the corpus reels whose OCR was degraded: easyocr, configured as ["fr","en"],
    # rendered Chinese and Japanese text as latin approximations
    # ("Zi#t# SCALLION PANCAKE" for 葱油饼, "FKAFFETJ" for 有KAFFE) — and its CJK
    # models only combine with English, so no single multilingual batch. RapidOCR
    # reads those scripts, fixes the latin along the way ("Ay-Clung" ->
    # "Ay-Chung"), runs on CPU (OCR no longer competes with the LLM for the card),
    # and is still maintained — easyocr has had no release since 09/2024.
    "rapidocr>=3.9",
    # step3_extract: the transform runs locally
    "ollama>=0.4",
    # transformers / accelerate / bitsandbytes / qwen-vl-utils were removed along
    # with the vision step. It loaded Qwen2-VL-7B directly (NF4 through
    # bitsandbytes) because the GGUF port of qwen2.5vl on Ollama returned
    # gibberish. The measurement that decided its removal: of the corpus's 296
    # verified entities, the VLM's output attested only 3 on its own (1%), all
    # generic common nouns the prompt rejects anyway.
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "ruff>=0.16.9",
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.8",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
mcp = [
    "mcp>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
reels = "interfaces.cli:main"
reels-mcp = "interfaces.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapters", "src/agent", "src/config", "src/domain", "src/inference", "src/interfaces", "src/pipeline", "src/quality", "src/storage"]

[tool.pytest.ini_options]
# `scripts/` is not a package and is not installed: without this, the tests that
# lock the quality heuristics cannot import them. They are tested rather than
# left to a script nobody runs twice, because one of them already shipped a
# directed bias (every CJK name counted as a common noun).
pythonpath = ["."]
