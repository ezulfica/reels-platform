<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Reels Platform target cloud deployment</title>
  <desc id="desc">Private web and a Discord agent access PostgreSQL through an authenticated read-only MCP. A scheduled Kubernetes job uses PostgreSQL and private object storage, and can use an ephemeral GPU worker only for bounded work.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fc}.zone{fill:#fff;stroke:#dce1ee;stroke-width:2}.box{fill:#fff;stroke:#5b5ce2;stroke-width:2}.data{fill:#eef0ff;stroke:#5b5ce2;stroke-width:2}.gpu{fill:#fff3f4;stroke:#d85264;stroke-width:2}.title{font:700 28px Inter,Arial,sans-serif;fill:#172033}.text{font:600 18px Inter,Arial,sans-serif;fill:#172033}.small{font:14px Inter,Arial,sans-serif;fill:#667085}.label{font:700 13px Inter,Arial,sans-serif;fill:#5b5ce2;letter-spacing:1px}.line{fill:none;stroke:#667085;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#d85264;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow-red)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#667085"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#d85264"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text x="56" y="54" class="title">Target cloud deployment</text>
  <text x="56" y="80" class="small">Private by default · CPU first · GPU rented only for bounded work</text>
  <rect class="zone" x="40" y="112" width="1120" height="530" rx="20"/>
  <text x="68" y="146" class="label">PRIVATE PLATFORM</text>

  <rect class="box" x="80" y="188" width="205" height="88" rx="14"/>
  <text x="104" y="225" class="text">Private web</text><text x="104" y="250" class="small">FastAPI · VPN / tailnet</text>
  <rect class="box" x="80" y="364" width="205" height="88" rx="14"/>
  <text x="104" y="401" class="text">Discord agent</text><text x="104" y="426" class="small">external assistant</text>
  <rect class="box" x="335" y="364" width="185" height="88" rx="14"/>
  <text x="365" y="401" class="text">Read-only MCP</text><text x="365" y="426" class="small">authenticated</text>

  <rect class="data" x="570" y="188" width="230" height="88" rx="14"/>
  <text x="596" y="225" class="text">PostgreSQL</text><text x="596" y="250" class="small">facts, feedback, jobs</text>
  <rect class="data" x="570" y="364" width="230" height="88" rx="14"/>
  <text x="596" y="401" class="text">Private object storage</text><text x="596" y="426" class="small">MP4, proxies, posters</text>

  <rect class="box" x="870" y="188" width="240" height="88" rx="14"/>
  <text x="896" y="225" class="text">Weekly Kubernetes Job</text><text x="896" y="250" class="small">idempotent CPU worker</text>
  <rect class="gpu" x="870" y="364" width="240" height="88" rx="14"/>
  <text x="896" y="401" class="text">Ephemeral GPU worker</text><text x="896" y="426" class="small">Runpod · bounded budget</text>

  <path class="line" d="M285 232H570"/>
  <path class="line" d="M285 408H335"/><path class="line" d="M520 408H570"/>
  <path class="line" d="M800 232H870"/><path class="line" d="M800 408H835V250H870"/>
  <path class="dash" d="M990 276V364"/>
  <path class="dash" d="M990 452V500H685V452"/>
  <text x="1010" y="330" class="small" fill="#d85264">only when needed</text>
  <text x="80" y="540" class="small">The web and MCP never launch the pipeline. The scheduled worker reads and writes through the durable stores.</text>
  <text x="80" y="572" class="small">The GPU receives short-lived object URLs; it never has direct PostgreSQL or permanent-secret access.</text>
</svg>
